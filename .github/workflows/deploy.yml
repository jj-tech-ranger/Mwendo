name: Deploy Mwendo Salama

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Centralized Firebase Project ID reference - requires explicit repository secret
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  quality-gate:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_MAP_TILE_URL: ${{ secrets.VITE_MAP_TILE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 1. Install root dependencies
        run: npm ci

      - name: 2. Install Functions dependencies
        run: cd apps/functions && npm ci

      - name: 3. Root Linter & Typecheck
        run: npm run lint

      - name: 4. Functions Linter & Typecheck
        run: cd apps/functions && npm run lint

      - name: 5. Build frontend & Bundle Security Audit
        run: |
          npm run build
          npm run check:bundle-security

      - name: 6. Build Functions
        working-directory: apps/functions
        run: npm run build

      - name: 7. Run Vitest tests
        run: npm test

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

      - name: Upload functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib/
          retention-days: 1

  deploy-hosting:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Verify Deployment Configuration
        run: |
          if [ -z "${{ env.FIREBASE_PROJECT_ID }}" ]; then
            echo "ERROR: FIREBASE_PROJECT_ID secret is required for deployment."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "ERROR: GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT secrets are required for deployment."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --non-interactive

  deploy-backend:
    name: Deploy Firebase Backend
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd apps/functions && npm ci

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib

      - name: Verify Deployment Configuration
        run: |
          if [ -z "${{ env.FIREBASE_PROJECT_ID }}" ]; then
            echo "ERROR: FIREBASE_PROJECT_ID secret is required for deployment."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "ERROR: GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT secrets are required for deployment."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy suspendUser
        run: |
          npx firebase-tools deploy \
            --only functions:suspendUser \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --force

      - name: Authenticate to Google Cloud (Refresh Token)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy remaining backend
        run: |
          npx firebase-tools deploy \
            --only functions,storage,firestore \
            --project "${{ env.FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --force
