name: Deploy Mwendo Production Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: mwendosalama-cf777
  NODE_VERSION: '20'
  WIF_PROVIDER: 'projects/942169450337/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
  WIF_SERVICE_ACCOUNT: 'github-actions-deployer@mwendosalama-cf777.iam.gserviceaccount.com'

jobs:
  validate:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Types
        run: npm run typecheck --if-present

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Test Suites
        run: npm run test --if-present

      - name: Run Bundle Security Audit
        run: |
          if [ -f "scripts/check-bundle-security.js" ]; then
            node scripts/check-bundle-security.js
          fi

  deploy-backend:
    name: Deploy Backend & Cloud Functions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install and Build Cloud Functions
        run: |
          cd apps/functions
          npm ci
          npm run build
          cd ../..

      # Authenticate to Google Cloud for the initial function deploy
      - name: Authenticate to Google Cloud (Phase 1)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Rules & Indexes
        run: |
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project ${{ env.PROJECT_ID }}

      - name: Deploy Storage Rules
        run: |
          npx firebase-tools deploy --only storage --project ${{ env.PROJECT_ID }}

      - name: Deploy Core Function (suspendUser)
        run: |
          npx firebase-tools deploy --only functions:suspendUser --project ${{ env.PROJECT_ID }}

      # Re-authentication: Exchanges for a fresh token before deploying the scheduled functions & remaining backend
      - name: Re-authenticate to Google Cloud (Phase 2)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Remaining Functions & Schedulers
        run: |
          npx firebase-tools deploy --only functions --project ${{ env.PROJECT_ID }}

  deploy-frontend:
    name: Build & Deploy Frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}

      - name: Authenticate to Google Cloud (Hosting)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting --project ${{ env.PROJECT_ID }}
