name: Deploy Mwendo Salama

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT_ID: mwendosalama-cf777
  FIREBASE_CLI_PREVIEWS: ""

jobs:

  # ============================================================
  # 1. TESTS
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js 22
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # --------------------------------------------------------
      # Java 21
      # Required by current Firebase Emulator Suite
      # --------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify runtime versions
        run: |
          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Java:"
          java --version

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install root dependencies
        run: npm ci

      # --------------------------------------------------------
      # Install Firebase CLI
      # --------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version

      # --------------------------------------------------------
      # Run Firestore emulator tests
      # --------------------------------------------------------
      - name: Run Firestore tests
        run: |
          npx firebase emulators:exec \
            --only firestore \
            --project demo-mwendo-salama-audit \
            "npm test"


  # ============================================================
  # 2. BUILD + DEPLOY HOSTING
  # ============================================================
  deploy-hosting:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js 22
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # --------------------------------------------------------
      # Java 21
      # --------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # --------------------------------------------------------
      # Authenticate with Google Cloud
      # --------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/942169450337/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions"
          service_account: "github-actions-deployer@mwendosalama-cf777.iam.gserviceaccount.com"

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------
      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.VITE_GOOGLE_MAPS_PLATFORM_KEY }}
          VITE_MAP_TILE_URL: ${{ secrets.VITE_MAP_TILE_URL }}

      # --------------------------------------------------------
      # Install Firebase CLI
      # --------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version

      # --------------------------------------------------------
      # Deploy Hosting
      # --------------------------------------------------------
      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive


  # ============================================================
  # 3. DEPLOY BACKEND
  # ============================================================
  deploy-backend:
    name: Deploy Firebase Backend
    runs-on: ubuntu-latest

    needs: test

    # Only deploy backend from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js 22
      # Firebase Functions are Node.js 22
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # --------------------------------------------------------
      # Java 21
      # Required for Firebase tooling/emulators
      # --------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify runtime versions
        run: |
          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Java:"
          java --version

      # --------------------------------------------------------
      # Authenticate with Google Cloud
      # --------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/942169450337/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions"
          service_account: "github-actions-deployer@mwendosalama-cf777.iam.gserviceaccount.com"

      # --------------------------------------------------------
      # Install root dependencies
      # --------------------------------------------------------
      - name: Install root dependencies
        run: npm ci

      # --------------------------------------------------------
      # Install Functions dependencies
      # --------------------------------------------------------
      - name: Install Functions dependencies
        working-directory: apps/functions
        run: npm ci

      # --------------------------------------------------------
      # Build Functions
      # --------------------------------------------------------
      - name: Build Functions
        working-directory: apps/functions
        run: npm run build

      # --------------------------------------------------------
      # Install Firebase CLI
      # --------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version

      # ========================================================
      # IMPORTANT:
      # Deploy ONLY suspendUser while diagnosing Cloud Build/IAM.
      #
      # Once suspendUser succeeds, change this to:
      #
      # --only functions,storage,firestore
      #
      # ========================================================
      - name: Deploy suspendUser
        run: |
          firebase deploy \
            --only functions:suspendUser \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      # --------------------------------------------------------
      # Storage + Firestore rules/indexes
      #
      # Kept separate from Functions so a Functions build
      # failure doesn't prevent rules/index deployment.
      # --------------------------------------------------------
      - name: Deploy Storage and Firestore
        run: |
          firebase deploy \
            --only storage,firestore \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      # --------------------------------------------------------
      # Configure Artifact Registry cleanup policy
      # --------------------------------------------------------
      - name: Configure Functions artifact cleanup
        run: |
          firebase functions:artifacts:setpolicy \
            --location us-central1 \
            --project "$FIREBASE_PROJECT_ID" \
            --force
