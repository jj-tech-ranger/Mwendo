name: Deploy Mwendo Salama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT_ID: mwendosalama-cf777

jobs:

  # ============================================================
  # JOB 1 — TESTS
  # ============================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Firebase Emulator currently requires Java 21+
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Java version
        run: java -version

      - name: Verify Node version
        run: node --version

      - name: Verify npm version
        run: npm --version

      - name: Checkout repository dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: apps/functions
        run: npm ci

      # --------------------------------------------------------
      # Build frontend first
      # --------------------------------------------------------
      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.VITE_GOOGLE_MAPS_PLATFORM_KEY }}
          VITE_MAP_TILE_URL: ${{ secrets.VITE_MAP_TILE_URL }}

      # --------------------------------------------------------
      # Firebase CLI
      # --------------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version

      # --------------------------------------------------------
      # Firebase Emulator tests
      #
      # IMPORTANT:
      # We run BOTH Firestore and Storage because the test suite
      # contains Storage security-rule tests.
      #
      # The tests use a DEMO project so they cannot accidentally
      # access production Firebase services.
      # --------------------------------------------------------
      - name: Run Firebase Emulator test suite
        env:
          # Frontend Firebase configuration required by tests
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: demo-mwendo-salama-audit
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}

          # Explicit emulator environment
          GCLOUD_PROJECT: demo-mwendo-salama-audit
          FIREBASE_PROJECT: demo-mwendo-salama-audit

        run: |
          npx firebase emulators:exec \
            --only firestore,storage \
            --project demo-mwendo-salama-audit \
            "npm test"

  # ============================================================
  # JOB 2 — HOSTING
  # ============================================================
  deploy-hosting:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest

    needs:
      - test

    # Only deploy Hosting from main.
    # Pull requests should test but never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.VITE_GOOGLE_MAPS_PLATFORM_KEY }}
          VITE_MAP_TILE_URL: ${{ secrets.VITE_MAP_TILE_URL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/942169450337/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
          service_account: 'github-actions-deployer@mwendosalama-cf777.iam.gserviceaccount.com'

      - name: Deploy Firebase Hosting
        run: |
          firebase deploy \
            --only hosting \
            --project mwendosalama-cf777 \
            --non-interactive

  # ============================================================
  # JOB 3 — BACKEND
  # ============================================================
  deploy-backend:
    name: Deploy Firebase Backend
    runs-on: ubuntu-latest

    needs:
      - test

    # Backend deployment only happens after tests pass
    # and only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/942169450337/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
          service_account: 'github-actions-deployer@mwendosalama-cf777.iam.gserviceaccount.com'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: apps/functions
        run: npm ci

      - name: Build Functions
        working-directory: apps/functions
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version

      # --------------------------------------------------------
      # IMPORTANT:
      # Deploy ONLY suspendUser first.
      #
      # This prevents one broken function from causing the entire
      # Functions deployment to fail while we verify the pipeline.
      # --------------------------------------------------------
      - name: Deploy suspendUser only
        run: |
          firebase deploy \
            --only functions:suspendUser \
            --project mwendosalama-cf777 \
            --non-interactive

      # --------------------------------------------------------
      # After suspendUser succeeds, deploy the remaining backend.
      #
      # NOTE:
      # If you want to continue isolating Functions until every
      # function is verified, keep this disabled temporarily.
      # --------------------------------------------------------
      - name: Deploy remaining Firebase backend
        run: |
          firebase deploy \
            --only functions,storage,firestore \
            --project mwendosalama-cf777 \
            --non-interactive
