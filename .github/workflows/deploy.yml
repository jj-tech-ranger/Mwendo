name: Deploy Mwendo Salama

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT_ID: mwendosalama-cf777

jobs:
  quality-gate:
    name: Production Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 1. Install root dependencies
        run: npm ci

      - name: 2. Install Functions dependencies
        run: cd apps/functions && npm ci

      - name: 3. Root Linter & Typecheck
        run: npm run lint

      - name: 4. Functions Linter & Typecheck
        run: cd apps/functions && npm run lint

      - name: 5. Build frontend & Bundle Security Audit
        run: |
          npm run build
          npm run check:bundle-security
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.VITE_GOOGLE_MAPS_PLATFORM_KEY }}
          VITE_MAP_TILE_URL: ${{ secrets.VITE_MAP_TILE_URL }}

      - name: 6. Build Functions
        working-directory: apps/functions
        run: npm run build

      - name: 7. Run emulator-backed Vitest tests
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: demo-mwendo-salama-audit
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          GCLOUD_PROJECT: demo-mwendo-salama-audit
          FIREBASE_PROJECT: demo-mwendo-salama-audit
        run: |
          npx firebase emulators:exec \
            --only firestore,storage \
            --project demo-mwendo-salama-audit \
            "npm test"

      - name: 8. Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 9. Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

      - name: Upload functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib/
          retention-days: 1

  deploy-hosting:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/942169450337/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions"
          service_account: "github-actions-deployer@mwendosalama-cf777.iam.gserviceaccount.com"

      - name: Deploy Firebase Hosting
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project mwendosalama-cf777 \
            --non-interactive

  deploy-backend:
    name: Deploy Firebase Backend
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd apps/functions && npm ci

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/942169450337/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions"
          service_account: "github-actions-deployer@mwendosalama-cf777.iam.gserviceaccount.com"

      - name: Deploy suspendUser
        run: |
          npx firebase-tools deploy \
            --only functions:suspendUser \
            --project mwendosalama-cf777 \
            --non-interactive

      - name: Deploy remaining backend
        run: |
          npx firebase-tools deploy \
            --only functions,storage,firestore \
            --project mwendosalama-cf777 \
            --non-interactive
