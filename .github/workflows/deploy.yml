name: Deploy Mwendo Salama

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  quality-gate:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_MAP_TILE_URL: ${{ secrets.VITE_MAP_TILE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: cd apps/functions && npm ci

      - name: Root Linter & Typecheck
        run: npm run lint

      - name: Functions Linter & Typecheck
        run: cd apps/functions && npm run lint

      - name: Build frontend & Bundle Security Audit
        run: |
          npm run build
          npm run check:bundle-security

      - name: Build Functions
        working-directory: apps/functions
        run: npm run build

      - name: Run Vitest tests
        run: npm test

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

      - name: Upload functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib/
          retention-days: 1

  deploy:
    name: Deploy Firebase Production
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd apps/functions && npm ci

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib

      - name: Verify deployment configuration
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PROJECT_ID}" || {
            echo "ERROR: FIREBASE_PROJECT_ID secret is required."
            exit 1
          }
          test "${FIREBASE_PROJECT_ID}" = "mwendo-salama-prod" || {
            echo "ERROR: FIREBASE_PROJECT_ID must be mwendo-salama-prod for production deployment."
            exit 1
          }
          test -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || {
            echo "ERROR: GCP_WORKLOAD_IDENTITY_PROVIDER secret is required."
            exit 1
          }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" || {
            echo "ERROR: GCP_SERVICE_ACCOUNT secret is required."
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting, Functions, Firestore and Storage
        run: |
          npx firebase-tools deploy \
            --only hosting,functions,firestore,storage \
            --project "${FIREBASE_PROJECT_ID}" \
            --non-interactive \
            --force
