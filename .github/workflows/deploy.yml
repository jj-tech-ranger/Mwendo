name: Deploy Mwendo Salama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  EXPECTED_GCP_SERVICE_ACCOUNT: mwendo-github-deployer-409@mwendo-salama-prod.iam.gserviceaccount.com

jobs:
  quality-gate:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_MAP_TILE_URL: ${{ secrets.VITE_MAP_TILE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify required production frontend configuration
        run: |
          set -euo pipefail
          required_vars=(VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then echo "ERROR: Required production secret $var is missing."; exit 1; fi
          done
          test "${VITE_FIREBASE_PROJECT_ID}" = "mwendo-salama-prod"
          test "${VITE_FIREBASE_AUTH_DOMAIN}" = "mwendo-salama-prod.firebaseapp.com"
          test "${VITE_FIREBASE_STORAGE_BUCKET}" = "mwendo-salama-prod.firebasestorage.app"
          test "${VITE_FIREBASE_MESSAGING_SENDER_ID}" = "1004280240722"
          test "${VITE_FIREBASE_APP_ID}" = "1:1004280240722:web:e339c20b645e839b3c5d8b"

      - name: Install root dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Install Functions dependencies
        run: cd apps/functions && npm ci

      - name: Root Linter & Typecheck
        run: bun run lint

      - name: Functions Linter & Typecheck
        run: cd apps/functions && npm run lint

      - name: Build frontend & Bundle Security Audit
        run: |
          bun run build
          bun run check:bundle-security

      - name: Build Functions
        working-directory: apps/functions
        run: npm run build

      - name: Run Vitest tests
        run: bun run test

      - name: Run Firebase Security Rules tests
        run: bun run test:rules

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

      - name: Upload functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib/
          retention-days: 1

  deploy:
    name: Deploy Firebase Production
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      MWENDO_DEMO_ADMIN_PASSWORD: ${{ secrets.MWENDO_DEMO_ADMIN_PASSWORD }}
      MWENDO_DEMO_SACCO_PASSWORD: ${{ secrets.MWENDO_DEMO_SACCO_PASSWORD }}
      MWENDO_DEMO_AUTHORITY_PASSWORD: ${{ secrets.MWENDO_DEMO_AUTHORITY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify deployment configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PROJECT_ID}" && test "${FIREBASE_PROJECT_ID}" = "mwendo-salama-prod"
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${GCP_SERVICE_ACCOUNT}" && test "${GCP_SERVICE_ACCOUNT}" = "${EXPECTED_GCP_SERVICE_ACCOUNT}"
          test "${GCP_WORKLOAD_IDENTITY_PROVIDER}" = "projects/1004280240722/locations/global/workloadIdentityPools/mwendo-github-actions/providers/github-actions"
          required_demo_secrets=(MWENDO_DEMO_ADMIN_PASSWORD MWENDO_DEMO_SACCO_PASSWORD MWENDO_DEMO_AUTHORITY_PASSWORD)
          for var in "${required_demo_secrets[@]}"; do test -n "${!var:-}"; done

      - name: Install root dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Install Functions dependencies
        run: cd apps/functions && npm ci

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-dist
          path: apps/functions/lib

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authenticated Google identity
        run: |
          set -euo pipefail
          authenticated_account="$(gcloud auth list --format='value(account)' | head -n 1)"
          test "${authenticated_account}" = "${EXPECTED_GCP_SERVICE_ACCOUNT}"

      - name: Provision production demo accounts
        run: bun run provision:demo-accounts

      - name: Deploy Firebase Hosting, Functions, Firestore and Storage
        run: bunx firebase-tools deploy --only hosting,functions,firestore,storage --project "${FIREBASE_PROJECT_ID}" --non-interactive --force
