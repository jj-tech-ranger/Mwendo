name: Repair Bun Lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): regenerate bun lockfile"
          git push origin HEAD:main
