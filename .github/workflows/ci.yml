name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyDUMMYTESTKEY1234567890123456789
      VITE_FIREBASE_AUTH_DOMAIN: demo-mwendo-salama-audit.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-mwendo-salama-audit
      VITE_FIREBASE_STORAGE_BUCKET: demo-mwendo-salama-audit.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
      VITE_FIREBASE_APP_ID: "1:123456789012:web:test"
      VITE_FIREBASE_DATABASE_ID: "(default)"
      GCLOUD_PROJECT: demo-mwendo-salama-audit
      FIREBASE_PROJECT: demo-mwendo-salama-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java runtime
        run: java -version

      - name: Install root dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Install Functions dependencies
        run: cd apps/functions && npm ci

      - name: Dependency security audit
        run: |
          npm audit --audit-level=high
          cd apps/functions
          npm audit --audit-level=high

      - name: Root Linter & Typecheck
        run: bun run lint

      - name: Functions Linter & Typecheck
        run: cd apps/functions && npm run lint

      - name: Build Frontend & Bundle Security Audit
        run: |
          bun run build
          bun run check:bundle-security

      - name: Build Functions
        run: cd apps/functions && npm run build

      - name: Run Vitest tests
        run: bun run test

      - name: Run Firebase Firestore & Storage rules tests
        run: bun run test:rules

      - name: Generate Test Coverage Report
        run: bun run test:coverage
