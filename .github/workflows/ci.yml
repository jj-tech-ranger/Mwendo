name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Linter & Typecheck
        run: npm run lint

      - name: Build Production Bundle & Audit Security
        run: |
          npm run build
          npm run check:bundle-security

      - name: Run Emulator-Backed Tests
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDUMMYTESTKEY1234567890123456789
          VITE_FIREBASE_AUTH_DOMAIN: demo-mwendo-salama-audit.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-mwendo-salama-audit
          VITE_FIREBASE_STORAGE_BUCKET: demo-mwendo-salama-audit.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          VITE_FIREBASE_APP_ID: "1:123456789012:web:test"
          VITE_FIREBASE_DATABASE_ID: "(default)"
        run: >
          npx firebase emulators:exec
          --only firestore,storage
          --project demo-mwendo-salama-audit
          "npm test"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test
