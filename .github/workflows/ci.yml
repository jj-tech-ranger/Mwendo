name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 1. Install root dependencies
        run: npm ci

      - name: 2. Install Functions dependencies
        run: cd apps/functions && npm ci

      - name: 3. Root Linter & Typecheck
        run: npm run lint

      - name: 4. Functions Linter & Typecheck
        run: cd apps/functions && npm run lint

      - name: 5. Build Frontend & Bundle Security Audit
        run: |
          npm run build
          npm run check:bundle-security

      - name: 6. Build Functions
        run: cd apps/functions && npm run build

      - name: 7. Run Vitest tests
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDUMMYTESTKEY1234567890123456789
          VITE_FIREBASE_AUTH_DOMAIN: demo-mwendo-salama-audit.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-mwendo-salama-audit
          VITE_FIREBASE_STORAGE_BUCKET: demo-mwendo-salama-audit.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          VITE_FIREBASE_APP_ID: "1:123456789012:web:test"
          VITE_FIREBASE_DATABASE_ID: "(default)"
          GCLOUD_PROJECT: demo-mwendo-salama-audit
          FIREBASE_PROJECT: demo-mwendo-salama-audit
        run: npm test

      - name: 7b. Generate Test Coverage Report (non-blocking)
        continue-on-error: true
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDUMMYTESTKEY1234567890123456789
          VITE_FIREBASE_AUTH_DOMAIN: demo-mwendo-salama-audit.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-mwendo-salama-audit
          VITE_FIREBASE_STORAGE_BUCKET: demo-mwendo-salama-audit.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          VITE_FIREBASE_APP_ID: "1:123456789012:web:test"
          VITE_FIREBASE_DATABASE_ID: "(default)"
          GCLOUD_PROJECT: demo-mwendo-salama-audit
          FIREBASE_PROJECT: demo-mwendo-salama-audit
        run: npm run test:coverage || true

      - name: 8. Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 9. Run Playwright E2E Tests
        run: npx playwright test
